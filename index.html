{id:"kit-circular-01",name:"Kit Circular 01",cat:"PRATOS & BANDEJAS",desc:"O Kit Circular 01 traz o círculo em três tamanhos que funcionam sozinhos ou juntos, criando uma coleção visualmente leve, equilibrada e atemporal.",price:110,installment:"R$ 130,00 em até 3x",details:"O Kit Circular 01 traz o círculo em três tamanhos que funcionam sozinhos ou juntos, criando uma coleção visualmente leve, equilibrada e atemporal.",spec:["Circular P — Ø 15 cm","Circular M — Ø 22 cm","Circular G — Ø 30 cm","Espessura — 18 mm","3 tamanhos + base"],image:"assets/kit-circular-01-1.png",gallery:["assets/kit-circular-01-1.png","assets/kit-circular-01-2.png"]},

const R=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v);
let cart=JSON.parse(localStorage.getItem("tria-cart")||"[]");
const get=id=>products.find(p=>p.id===id);
function save(){localStorage.setItem("tria-cart",JSON.stringify(cart))}
function count(){return cart.reduce((a,b)=>a+b.q,0)}
function total(){return cart.reduce((a,b)=>a+get(b.id).price*b.q,0)}
function add(id,q=1){let x=cart.find(i=>i.id===id);x?x.q+=q:cart.push({id,q});save();render()}
function setq(id,q){cart=cart.map(i=>i.id===id?{...i,q}:i).filter(i=>i.q>0);save();render()}
function remove(id){cart=cart.filter(i=>i.id!==id);save();render()}

</a>

function card(p){return `<a class="card" href="#/produto/${p.id}">${pic(p)}<div class="cardinfo"><h3>${p.name}</h3><p>${p.desc}</p><b>${R(p.price)}</b></div></a>`}
function home(){return `${header()}<main><section class="hero"><div class="inner"><div class="eyebrow light">TRÊS OLHARES. UMA FORMA</div><h1>Moldes de alta<br>precisão para cerâmica</h1><p>Moldes em MDF, pensados para precisão, praticidade — para ceramistas e ateliês que produzem em série sem perder a essência do feito à mão.</p><div class="buttons"><a class="btn lightbtn hero-moldes-btn" href="#/moldes">VER MOLDES <span class="arrow">→</span></a><a class="btn outline" href="#/processo">NOSSO PROCESSO</a></div></div></section><section class="features">
<div class="feature"><span class="feature-icon ruler" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M9 27 27 9l4 4-18 18-4-4Z"/><path d="m15 21 3 3m0-9 3 3m-9 0 3 3m3 3 3 3"/></svg></span><h3>Alta precisão</h3><p>Matrizes pensadas para repetibilidade e acabamento.</p></div>
<div class="feature"><span class="feature-icon layers" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="m8 14 12-6 12 6-12 6-12-6Z"/><path d="m8 20 12 6 12-6"/><path d="m8 26 12 6 12-6"/></svg></span><h3>Para ateliês</h3><p>Mais agilidade sem perder o gesto artesanal.</p></div>
<div class="feature"><span class="feature-icon tag" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="m8 10 14 3 9 9-12 12-9-9-3-14 1-1Z"/><circle cx="17" cy="18" r="2"/></svg></span><h3>Do design à produção</h3><p>Do desenho à matriz pronta para produzir.</p></div>
<div class="feature"><span class="feature-icon box" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="m8 14 12-7 12 7v13l-12 7-12-7V14Z"/><path d="m8 14 12 7 12-7M20 21v13"/></svg></span><h3>Todo o Brasil</h3><p>Enviamos nossos moldes para todo o país.</p></div>
</section><section class="section"><div class="sectionhead"><div><div class="eyebrow">SELEÇÃO</div><h2>Moldes em destaque</h2></div><a class="cataloglink" href="#/moldes">VER CATÁLOGO →</a></div><div class="grid homegrid">${["kit-coador","kit-pinheiro-natal","kit1","kit2"].map(id=>get(id)).filter(Boolean).map(card).join("")}</div></section><section class="process" id="processo"><div class="processblock"><img class="processimage" src="assets/processo-design.png" alt="Processo de design e prototipagem dos moldes TRÍA"><div class="processcopy"><div class="eyebrow">01 — DESIGN</div><h2>Do desenho ao protótipo</h2><p>Cada forma nasce de um estudo técnico: proporções, ângulos de saída, linhas de partição e detalhes que garantem um molde preciso e funcional. Desenvolvemos cada modelo pensando no processo de produção e no resultado final da peça.</p></div></div><div class="processblock"><img class="processimage" src="assets/processo-producao.png" alt="Processo de produção dos moldes TRÍA"><div class="processcopy"><div class="eyebrow">02 — PRODUÇÃO</div><h2>Moldes que acompanham seu ritmo</h2><p>Nossos moldes são produzidos em MDF e desenvolvidos para oferecer precisão, resistência e praticidade no processo de produção. Todos os modelos acompanham puxador para facilitar a desmoldagem, tornando o processo mais ágil e seguro, mesmo em produções recorrentes.</p></div></div></section><section class="cta"><div class="inner"><div class="eyebrow light">PARA O SEU ATELIÊ</div><h2>Tem uma peça autoral para transformar em série?</h2><p>Desenvolvemos moldes para o seu ateliê — do croqui à matriz de produção.</p><a class="btn lightbtn" href="#/moldes">COMPRAR MOLDES →</a></div></section><section class="story"><div><div class="storypic"><img src="assets/nossa-historia.png" alt="Luana, Mariana e Carla no ateliê de cerâmica"><div class="storycaption">LUANA · MARIANA · CARLA</div></div></div><div><div class="eyebrow">NOSSA HISTÓRIA</div><h2>Três mulheres. Três caminhos. Um sonho ganhando forma.</h2><div class="storysub">DUAS DESIGNERS DE INTERIORES · UMA ADVOGADA</div><p>A TRÍA nasceu quando Luana, Mariana e Carla decidiram reunir seus olhares e transformar uma ideia em algo real. Vindas de universos que se completam, as três encontraram uma linguagem em comum: a sensibilidade para enxergar possibilidades, a técnica para dar estrutura e a alegria de criar algo com propósito.</p><p>Assim começou um estúdio de moldes para cerâmica pensado para quem faz com as mãos, imprime identidade em cada peça e transforma o processo em arte. Formas essenciais, desenhos autorais e liberdade para que cada criação encontre o seu próprio caminho.</p><blockquote>A TRÍA nasce do encontro entre criação, matéria e liberdade.</blockquote><p>Estamos no começo — e é justamente isso que torna cada conquista tão especial. Há entusiasmo em cada conversa, emoção em cada novo molde e uma felicidade imensa em ver um sonho compartilhado ganhar vida. Três olhares, três perspectivas diferentes seguindo na mesma direção.</p><p class="storysignature">Três olhares, uma forma.</p></div></section></main>${footer()}`}
function catalog(){let cat=decodeURIComponent((location.hash.split("cat=")[1]||"TODOS"));let cats=["TODOS","TIGELAS","CANECAS & COPOS","VASOS","PRATOS & BANDEJAS","AUTORAIS","KITS"];let list=cat==="TODOS"?products:products.filter(p=>p.cat===cat);return `${header()}<main class="catalog"><div class="eyebrow">CATÁLOGO</div><h1>Moldes</h1><div class="filters">${cats.map(c=>`<button class="${c===cat?"active":""}" onclick="location.hash='/moldes?cat='+encodeURIComponent('${c}')">${c}</button>`).join("")}</div><div class="grid">${list.map(card).join("")}</div></main>${footer()}`}
function product(id){let p=get(id);if(!p)return `${header()}<main class="catalog"><h1>Produto não encontrado</h1></main>${footer()}`;return `${header()}<main class="product"><div><div class="productpic">${p.image?`<img id="mainProductImage" src="${p.gallery?.[0]||p.image}" alt="${p.name}">`:`<span>TRÍA</span>`}</div>${p.gallery&&p.gallery.length>1?`<div class="product-thumbs">${p.gallery.map((g,i)=>`<button onclick="document.getElementById('mainProductImage').src='${g}'"><img src="${g}" alt="${p.name} ${i+1}"></button>`).join("")}</div>`:""}</div><div><div class="eyebrow accent">${p.cat}</div><h1>${p.name}</h1><div class="price">${R(p.price)} <small>no pix ou ${p.installment||"150,00 em até 3x"}</small></div><p class="desc">${p.details}</p><div class="spec"><h3>Especificações</h3>${p.spec.map(s=>`• ${s}<br>`).join("")}</div><div class="purchase"><div class="qty"><button onclick="this.nextElementSibling.textContent=Math.max(1,+this.nextElementSibling.textContent-1)">−</button><span id="pq">1</span><button onclick="this.previousElementSibling.textContent=+this.previousElementSibling.textContent+1">+</button></div><button class="buy" onclick="add('${p.id}',+document.getElementById('pq').textContent)">ADICIONAR AO CARRINHO</button></div><button class="buyoutline" onclick="add('${p.id}',+document.getElementById('pq').textContent);location.hash='/carrinho'">COMPRAR AGORA</button></div></main>${footer()}`}
function cartpage(){if(!cart.length)return `${header()}<main class="cart"><h1>Carrinho</h1><div class="empty"><p>Seu carrinho está vazio.</p><a class="btn dark" href="#/moldes">VER MOLDES →</a></div></main>${footer()}`;return `${header()}<main class="cart"><h1>Carrinho</h1><div class="cartitems">${cart.map(i=>{let p=get(i.id);return `<div class="cartitem"><div class="thumb">TRÍA</div><div><h3>${p.name}</h3><p>${R(p.price)} / un.</p></div><div class="cartqty"><button onclick="setq('${p.id}',${i.q-1})">−</button><span>${i.q}</span><button onclick="setq('${p.id}',${i.q+1})">+</button></div><div class="subtotal">${R(p.price*i.q)}</div><button class="trash" onclick="remove('${p.id}')">♧</button></div>`}).join("")}</div><div class="summary"><div class="summarybox"><span>TOTAL</span><strong>${R(total())}</strong><a class="btn dark" href="#/checkout">FINALIZAR PEDIDO →</a><p>Frete calculado após a confirmação do pedido.</p></div></div></main>${footer()}`}
function account(){return `${header()}<main class="account"><div class="eyebrow">CONTA</div><h1>Entrar</h1><p>Acompanhe seus pedidos e finalize suas compras com mais rapidez.</p><form class="form" onsubmit="event.preventDefault();alert('Área de conta preparada para integração.')"><label>E-mail<input type="email" required></label><label>Senha<input type="password" required></label><button class="btn dark">ENTRAR</button></form><a class="centerlink" href="#">Ainda não tenho conta</a><a class="centerlink" href="#/moldes">VOLTAR AO CATÁLOGO</a></main>${footer()}`}
async function createMercadoPagoCheckout(event){event.preventDefault();if(!cart.length){location.hash="/carrinho";return}const form=event.target;const paymentMethod=form.querySelector('input[name="paymentMethod"]:checked')?.value;if(!paymentMethod){alert("Selecione PIX ou cartão de crédito.");return}const btn=form.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent="CRIANDO CHECKOUT...";try{const payload={items:cart.map(i=>({id:i.id,quantity:i.q})),paymentMethod,customer:{email:form.querySelector('[name="email"]').value.trim(),name:form.querySelector('[name="name"]').value.trim(),phone:form.querySelector('[name="phone"]').value.trim()}};const r=await fetch('/api/create-preference',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok||!data.init_point)throw new Error(data.details ? `${data.error} Detalhe: ${data.details}` : (data.error||'Não foi possível criar o checkout.'));localStorage.setItem('tria-pending-order',JSON.stringify({orderId:data.orderId,preferenceId:data.preferenceId,createdAt:new Date().toISOString()}));window.location.href=data.init_point}catch(err){alert(err.message||'Erro ao iniciar o pagamento.');btn.disabled=false;btn.textContent='CONTINUAR PARA PAGAMENTO →'}}
function checkout(){if(!cart.length)return `${header()}<main class="cart"><h1>Carrinho</h1><div class="empty"><p>Seu carrinho está vazio.</p><a class="btn dark" href="#/moldes">VER MOLDES →</a></div></main>${footer()}`;return `${header()}<main class="checkout"><div class="checkoutform"><div class="eyebrow">FINALIZAR PEDIDO</div><h1>Seus dados</h1><form class="form" onsubmit="createMercadoPagoCheckout(event)"><div class="tw"><label>Nome<input name="name" required></label><label>Telefone<input name="phone" required></label></div><label>E-mail<input name="email" type="email" required></label><label>Endereço<input name="address" required></label><div class="three"><label>CEP<input name="cep" required></label><label>Cidade<input name="city" required></label><label>UF<input name="uf" required maxlength="2" style="text-transform:uppercase"></label></div><div style="margin-top:12px"><div class="eyebrow">FORMA DE PAGAMENTO</div><div style="display:grid;gap:10px"><label style="border:1px solid var(--line);padding:16px;cursor:pointer"><input type="radio" name="paymentMethod" value="pix" required style="width:auto;height:auto;margin:0 8px 0 0"> PIX — valor PIX do catálogo</label><label style="border:1px solid var(--line);padding:16px;cursor:pointer"><input type="radio" name="paymentMethod" value="card" style="width:auto;height:auto;margin:0 8px 0 0"> Cartão de crédito — valor de cartão do catálogo, em até 3x</label></div></div><button type="submit" class="btn dark">CONTINUAR PARA PAGAMENTO →</button></form></div><aside class="ordersum"><div class="eyebrow">RESUMO</div>${cart.map(i=>{let p=get(i.id);return `<div class="line"><span>${p.name} × ${i.q}</span><b>${R(p.price*i.q)}</b></div>`}).join("")}<h2>${R(total())}</h2><p>O valor final será definido pela forma de pagamento escolhida, conforme os preços do catálogo.</p></aside></main>${footer()}`}
function paymentResult(type){const titles={sucesso:'Pagamento recebido',pendente:'Pagamento pendente',falhou:'Pagamento não concluído'};const texts={sucesso:'Recebemos o retorno do Mercado Pago. A confirmação definitiva do pagamento é feita pelo nosso servidor.',pendente:'O pagamento ainda não foi confirmado. Aguarde a atualização do Mercado Pago.',falhou:'O pagamento não foi concluído. Você pode voltar ao carrinho e tentar novamente.'};return `${header()}<main class="success"><div class="eyebrow">MERCADO PAGO</div><h1>${titles[type]}</h1><p>${texts[type]}</p><a class="btn dark" href="#/moldes">VOLTAR AO CATÁLOGO</a></main>${footer()}`}
function showProductImage(i){const imgs=document.querySelectorAll(".product-gallery img");const dots=document.querySelectorAll(".gallery-dots button");imgs.forEach((x,n)=>x.classList.toggle("active",n===i));dots.forEach((x,n)=>x.classList.toggle("active",n===i));}
function render(){let h=location.hash||"#/";let content=h.startsWith("#/produto/")?product(h.split("/")[2]):h.startsWith("#/moldes")?catalog():h==="#/carrinho"?cartpage():h==="#/conta"?account():h==="#/checkout"?checkout():h==="#/pagamento/sucesso"?paymentResult("sucesso"):h==="#/pagamento/pendente"?paymentResult("pendente"):h==="#/pagamento/falhou"?paymentResult("falhou"):home();document.getElementById("app").innerHTML=content;window.scrollTo(0,0)}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
